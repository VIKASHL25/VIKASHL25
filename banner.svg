<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Vikas HL - Agentic AI, ML Systems, Backend Engineering" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"><animate attributeName="stop-color" values="#0b1020;#111a3a;#0b1020" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="55%" stop-color="#1e1b4b"><animate attributeName="stop-color" values="#1e1b4b;#312e81;#1e1b4b" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#0e7490"><animate attributeName="stop-color" values="#0e7490;#0891b2;#0e7490" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <!-- soft moving glows -->
    <circle cx="180" cy="80" r="180" fill="url(#glow)">
      <animate attributeName="cx" values="180;320;180" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="80;140;80" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1020" cy="230" r="200" fill="url(#glow)">
      <animate attributeName="cx" values="1020;900;1020" dur="14s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;170;230" dur="14s" repeatCount="indefinite"/>
    </circle>

    <!-- neural network on the right -->
    <g stroke="#a5b4fc" stroke-opacity="0.35" stroke-width="1.2" fill="none" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="3s" repeatCount="indefinite"/>
      <path d="M840 70 L940 40 L1040 80 L1130 50"/>
      <path d="M840 70 L930 130 L1040 80"/>
      <path d="M940 40 L930 130 L1050 170 L1130 130"/>
      <path d="M930 130 L860 210 L980 250 L1050 170"/>
      <path d="M1040 80 L1050 170 L1140 230"/>
      <path d="M860 210 L780 150 L840 70"/>
      <path d="M980 250 L1100 270 L1140 230"/>
    </g>
    <g>
      <circle cx="840" cy="70" r="6" fill="#67e8f9"><animate attributeName="r" values="4;8;4" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="40" r="6" fill="#a5b4fc"><animate attributeName="r" values="4;8;4" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="1040" cy="80" r="7" fill="#67e8f9"><animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="50" r="5" fill="#a5b4fc"><animate attributeName="r" values="3;7;3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="130" r="8" fill="#818cf8"><animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1050" cy="170" r="7" fill="#67e8f9"><animate attributeName="r" values="5;9;5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="1130" cy="130" r="5" fill="#a5b4fc"><animate attributeName="r" values="3;7;3" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="860" cy="210" r="6" fill="#a5b4fc"><animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="250" r="6" fill="#67e8f9"><animate attributeName="r" values="4;8;4" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="780" cy="150" r="5" fill="#818cf8"><animate attributeName="r" values="3;7;3" dur="3.3s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="230" r="6" fill="#67e8f9"><animate attributeName="r" values="4;8;4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="1100" cy="270" r="4" fill="#a5b4fc"><animate attributeName="r" values="3;6;3" dur="3.2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="70" y="68" font-size="17" fill="#67e8f9" letter-spacing="4" font-weight="600">
        <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
        HELLO, I'M
      </text>
      <text x="70" y="150" font-size="80" font-weight="800" fill="url(#title)">
        <animate attributeName="opacity" values="0;1" dur="1.6s" fill="freeze"/>
        Vikas HL
      </text>
      <text x="72" y="196" font-size="24" fill="#e0e7ff" font-weight="500">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2.4s" fill="freeze"/>
        Agentic AI  ·  ML Systems  ·  Backend Engineering
      </text>
      <text x="72" y="236" font-size="18" fill="#a5b4fc" font-weight="500" letter-spacing="1">
        <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.6;1" dur="3s" fill="freeze"/>
        LangGraph  ·  RAG  ·  FastAPI  ·  Docker  ·  Kubernetes
      </text>
    </g>

    <!-- bottom accent bar -->
    <rect x="0" y="292" width="1200" height="8" fill="#67e8f9" opacity="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
